name: Ozen
options:
  bundleIdPrefix: com.arbelonson.ozen
  deploymentTarget:
    iOS: "17.0"

packages:
  OzenKit:
    path: .

targets:
  Ozen:
    type: application
    platform: iOS
    sources:
      - path: App/Ozen
    dependencies:
      - package: OzenKit
        product: OzenKit
      - package: OzenKit
        product: OzenPlatform
    info:
      path: App/Ozen/Info.plist
      properties:
        NSMicrophoneUsageDescription: "Ozen needs the microphone to caption conversation live."
        NSSpeechRecognitionUsageDescription: "Ozen uses on-device speech recognition to caption conversation live. Nothing is sent off the phone."
        UILaunchScreen: {}
        CFBundleDevelopmentRegion: he
        CFBundleDisplayName: "אוזן"
        CFBundleLocalizations: [he, en]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"

  OzenTests:
    type: bundle.unit-test
    platform: iOS
    # OzenKitTests/OzenPlatformTests are compiled straight into this bundle
    # (rather than relying on Xcode auto-generating a scheme for the local
    # SPM package's own test targets, which isn't guaranteed to exist in a
    # headless `xcodebuild` invocation) so every test in the repo actually
    # runs somewhere real: the ones that need Apple frameworks get an
    # actual iOS Simulator to run on, which plain `swift test` can't give
    # them on macOS (AVAudioSession, Accelerate specifics, etc.).
    sources:
      - path: App/OzenTests
      - path: Tests/OzenKitTests
      - path: Tests/OzenPlatformTests
    dependencies:
      - target: Ozen
      - package: OzenKit
        product: OzenKit
      - package: OzenKit
        product: OzenPlatform
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Ozen:
    build:
      targets:
        Ozen: all
        OzenTests: [test]
    test:
      targets:
        - OzenTests
