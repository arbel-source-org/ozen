name: Ozen
options:
  bundleIdPrefix: com.arbelonson.ozen
  deploymentTarget:
    iOS: "17.0"

packages:
  OzenKit:
    path: .

targets:
  Ozen:
    type: application
    platform: iOS
    sources:
      - path: App/Ozen
      - path: App/Shared
    dependencies:
      - package: OzenKit
        product: OzenKit
      - package: OzenKit
        product: OzenPlatform
      # The lock screen captions (a Live Activity), embedded in PlugIns.
      - target: OzenCaptionsWidget
        embed: true
    info:
      path: App/Ozen/Info.plist
      properties:
        NSMicrophoneUsageDescription: "Ozen needs the microphone to caption conversation live."
        NSSpeechRecognitionUsageDescription: "Ozen uses on-device speech recognition to caption conversation live. Nothing is sent off the phone."
        UILaunchScreen: {}
        CFBundleDevelopmentRegion: he
        CFBundleDisplayName: "Ozen"
        # The home screen shows the English name; Siri still answers to the
        # Hebrew one ("start captions in Ozen", said in Hebrew).
        INAlternativeAppNames:
          - INAlternativeAppName: "אוזן"
            INAlternativeAppNamePronunciationHint: "Ozen"
        # Spelled out so a release build's number (set by release.yml)
        # is what Settings and Diagnostics show.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [he, en]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # An iPad app has to turn every way, upside down included, to run
        # side by side with other apps.
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"

  OzenCaptionsWidget:
    type: app-extension
    platform: iOS
    # Draws the Live Activity the app starts: the newest caption lines on
    # the lock screen and in the Dynamic Island. No OzenKit here; the app
    # sends it finished lines (App/Shared/CaptionActivityAttributes.swift).
    # Also the "start captions" button for Control Center (iOS 18).
    sources:
      - path: App/OzenWidget
      - path: App/Shared
    info:
      path: App/OzenWidget/Info.plist
      properties:
        CFBundleDisplayName: "Ozen"
        CFBundleDevelopmentRegion: he
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # An extension's identifier has to start with its app's.
        PRODUCT_BUNDLE_IDENTIFIER: com.arbelonson.ozen.Ozen.Captions
        # Shared code that only makes sense in the app checks this.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) OZEN_WIDGET_EXTENSION"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        SKIP_INSTALL: YES

  OzenTests:
    type: bundle.unit-test
    platform: iOS
    # OzenKitTests/OzenPlatformTests are compiled straight into this bundle
    # (rather than relying on Xcode auto-generating a scheme for the local
    # SPM package's own test targets, which isn't guaranteed to exist in a
    # headless `xcodebuild` invocation) so every test in the repo actually
    # runs somewhere real: the ones that need Apple frameworks get an
    # actual iOS Simulator to run on, which plain `swift test` can't give
    # them on macOS (AVAudioSession, Accelerate specifics, etc.).
    sources:
      - path: App/OzenTests
      - path: Tests/OzenKitTests
      - path: Tests/OzenPlatformTests
    dependencies:
      - target: Ozen
      - package: OzenKit
        product: OzenKit
      - package: OzenKit
        product: OzenPlatform
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

  OzenUITests:
    type: bundle.ui-testing
    platform: iOS
    # Screenshots of the caption screen for a human (or an agent) to look
    # at, since nothing in OzenTests actually renders a screen. Launches
    # the real app with `-uiTestScreenshots <variant>`, which OzenApp reads
    # in DEBUG builds only to seed a canned conversation
    # (`ScreenshotFixtures`) instead of starting real capture. Not part of
    # the `Ozen` scheme's own test run — routine pushes don't pay for this;
    # it runs from `.github/workflows/ui-screenshots.yml`, by hand.
    sources:
      - path: App/OzenUITests
    dependencies:
      - target: Ozen
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Ozen:
    build:
      targets:
        Ozen: all
        OzenTests: [test]
    test:
      targets:
        - OzenTests

  OzenUITests:
    build:
      targets:
        Ozen: all
        OzenUITests: [test]
    test:
      targets:
        - OzenUITests
