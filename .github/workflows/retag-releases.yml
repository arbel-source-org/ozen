name: Move releases to version tags

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retag:
    name: Retag build-N releases as vX.Y.N
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Retag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^ *MARKETING_VERSION: *"\([0-9.]*\)".*/\1/p' project.yml | head -n 1)
          SERIES=${VERSION%.*}
          gh api "repos/$REPO/releases?per_page=100" --paginate \
            --jq '.[] | select(.tag_name | startswith("build-")) | "\(.id) \(.tag_name)"' |
          while read -r id tag; do
            new="v$SERIES.${tag#build-}"
            sha=$(gh api "repos/$REPO/git/ref/tags/$tag" --jq .object.sha)
            gh api "repos/$REPO/git/ref/tags/$new" >/dev/null 2>&1 ||
              gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$new" -f sha="$sha" >/dev/null
            gh api -X PATCH "repos/$REPO/releases/$id" -f tag_name="$new" >/dev/null
            gh api -X DELETE "repos/$REPO/git/refs/tags/$tag"
            echo "$tag -> $new at $sha"
          done
          newest=$(gh api "repos/$REPO/releases?per_page=100" --paginate --jq '.[].tag_name' | sort -V | tail -n 1)
          gh release edit "$newest" -R "$REPO" --latest >/dev/null
          echo "latest: $newest"
          gh api "repos/$REPO/releases?per_page=100" --jq '.[].tag_name'
