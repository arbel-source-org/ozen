name: CI

on:
  push:
  pull_request:

jobs:
  ozenkit-linux:
    name: OzenKit (Linux, portable core)
    runs-on: ubuntu-latest
    # A hung test would otherwise hold the runner for GitHub's six-hour
    # default; the whole job normally takes about a minute.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - run: swift build
      - run: swift test

  app:
    name: Ozen app (iOS Simulator)
    runs-on: macos-15
    # Normally about eight minutes; a hung test fails the run instead.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Find an available iOS Simulator
        id: sim
        # Not hardcoded on purpose: a pinned device name (e.g. "iPhone 16")
        # broke the very first time this ran, because the runner's default
        # Xcode didn't have that particular simulator registered. Ask the
        # machine what it actually has instead of guessing a name that
        # will just as easily go stale on the next runner image update.
        run: |
          DEVICE=$(xcrun simctl list devices available -j \
            | jq -r '.devices | to_entries[] | .value[] | select(.name | test("iPhone")) | .name' \
            | head -n1)
          if [ -z "$DEVICE" ]; then
            echo "No available iPhone simulator found" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Ozen.xcodeproj \
            -scheme Ozen \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            2>&1 | tee xcodebuild-raw.log | xcpretty
      - name: Verify tests actually ran (don't just trust a green exit code)
        # xcpretty's filtered output showed no per-test lines at all on an
        # earlier run, which turned out to hide a real gap (OzenPlatform's
        # own test target wasn't wired into any scheme, so its tests
        # silently never ran anywhere). Checking the raw, unfiltered
        # xcodebuild log for the classic "Executed N tests" line is what
        # actually confirms N > 0, rather than trusting a bare success exit.
        run: |
          # Two different test reporters can appear here depending on how
          # Xcode's test host surfaces results (classic XCTest-style
          # "Executed N tests", or swift-testing's own "Test run with N
          # tests" summary) - accept either, but require an actual
          # positive count from at least one of them.
          if ! grep -qE "Executed [1-9][0-9]* test|Test run with [1-9][0-9]* test" xcodebuild-raw.log; then
            echo "No tests were actually executed - failing rather than trusting a green checkmark." >&2
            grep -iE "executed|test suite|test run" xcodebuild-raw.log || true
            exit 1
          fi
          grep -E "Executed [0-9]+ test|Test run with [0-9]+ test|Test Suite '(OzenKitTests|OzenPlatformTests|OzenTests|All tests)'" xcodebuild-raw.log
