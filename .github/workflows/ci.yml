name: CI

on:
  push:
  pull_request:

jobs:
  ozenkit-linux:
    name: OzenKit (Linux, portable core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - run: swift build
      - run: swift test

  ozenkit-macos:
    name: OzenKit + OzenPlatform (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  app:
    name: Ozen app (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Build and test
        run: |
          xcodebuild test \
            -project Ozen.xcodeproj \
            -scheme Ozen \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            | xcpretty && exit ${PIPESTATUS[0]}
