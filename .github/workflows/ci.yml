name: CI

on:
  # A change that only touches documentation can't break a build or a
  # test, and the iOS job holds a macOS runner for a quarter of an hour.
  push:
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']

# A newer push to the same branch tests everything an older run would
# have, so the older one is cancelled: a morning of small commits
# otherwise queues one macOS runner after another and the result for the
# latest commit arrives an hour late.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ozenkit-linux:
    name: OzenKit (Linux, portable core)
    runs-on: ubuntu-latest
    # A hung test would otherwise hold the runner for GitHub's six-hour
    # default; the whole job normally takes about a minute.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - run: swift build
      - run: swift test

  app:
    name: Ozen app (iOS Simulator)
    runs-on: macos-15
    # Normally about seven minutes; a hung test fails the run instead.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Find an available iOS Simulator
        id: sim
        # Not hardcoded on purpose: a pinned device name (e.g. "iPhone 16")
        # broke the very first time this ran, because the runner's default
        # Xcode didn't have that particular simulator registered. Ask the
        # machine what it actually has instead of guessing a name that
        # will just as easily go stale on the next runner image update.
        run: |
          DEVICE=$(xcrun simctl list devices available -j \
            | jq -r '.devices | to_entries[] | .value[] | select(.name | test("iPhone")) | .name' \
            | head -n1)
          if [ -z "$DEVICE" ]; then
            echo "No available iPhone simulator found" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
      - name: Name this week
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the previous build
        # Most of the build is WhisperKit and the packages under it, which
        # don't change between commits. Restored with their timestamps,
        # Xcode reuses them and compiles only this repo's code; macOS minutes
        # are scarce on a private repository. A new cache each week picks up
        # package updates the manifest allows.
        uses: actions/cache@v6
        with:
          path: |
            DerivedData
            !DerivedData/Logs
          key: deriveddata-${{ hashFiles('Package.swift', 'project.yml') }}-${{ steps.week.outputs.week }}
          restore-keys: |
            deriveddata-${{ hashFiles('Package.swift', 'project.yml') }}-
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Ozen.xcodeproj \
            -scheme Ozen \
            -derivedDataPath DerivedData \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            2>&1 | tee xcodebuild-raw.log | xcpretty
      - name: Show why it failed
        # xcpretty prints nothing useful when a test fails in a way it
        # doesn't recognise, or the test host crashes: the run just ends
        # after "All tests" with exit code 65. The raw log has the answer.
        if: failure()
        run: |
          if [ -f xcodebuild-raw.log ]; then
            grep -nE "error:|failed|✘|recorded an issue|Fatal error|crashed|Terminating app|Restarting after unexpected exit|Test session results" xcodebuild-raw.log | head -80 || true
            echo "----- last 80 lines -----"
            tail -n 80 xcodebuild-raw.log
          fi
      - name: Keep the raw test log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: xcodebuild-raw-log
          path: xcodebuild-raw.log
          if-no-files-found: ignore
      - name: Verify tests actually ran (don't just trust a green exit code)
        # xcpretty's filtered output showed no per-test lines at all on an
        # earlier run, which turned out to hide a real gap (OzenPlatform's
        # own test target wasn't wired into any scheme, so its tests
        # silently never ran anywhere). Checking the raw, unfiltered
        # xcodebuild log for the classic "Executed N tests" line is what
        # actually confirms N > 0, rather than trusting a bare success exit.
        run: |
          # Two different test reporters can appear here depending on how
          # Xcode's test host surfaces results (classic XCTest-style
          # "Executed N tests", or swift-testing's own "Test run with N
          # tests" summary) - accept either, but require an actual
          # positive count from at least one of them.
          if ! grep -qE "Executed [1-9][0-9]* test|Test run with [1-9][0-9]* test" xcodebuild-raw.log; then
            echo "No tests were actually executed - failing rather than trusting a green checkmark." >&2
            grep -iE "executed|test suite|test run" xcodebuild-raw.log || true
            exit 1
          fi
          grep -E "Executed [0-9]+ test|Test run with [0-9]+ test|Test Suite '(OzenKitTests|OzenPlatformTests|OzenTests|All tests)'" xcodebuild-raw.log
